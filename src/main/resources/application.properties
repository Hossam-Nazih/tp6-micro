spring.application.name=student-management

# ===== MySQL de Workbench (localhost:3306, root sans mot de passe) =====
# createDatabaseIfNotExist=true : la base gestion_etudiants_db est créée au premier démarrage,
# le "CREATE DATABASE" de l'énoncé n'est donc pas nécessaire.
spring.datasource.url=jdbc:mysql://localhost:3306/gestion_etudiants_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=LOCAL
spring.datasource.username=root
spring.datasource.password=

# ===== JPA / Hibernate =====
# update : crée les tables et colonnes manquantes à partir des entités, sans jamais rien supprimer
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Pas de session Hibernate ouverte pendant l'écriture du JSON : une association LAZY non chargée échoue
# tout de suite au lieu de déclencher des requêtes cachées (et Spring n'affiche plus d'avertissement au démarrage)
spring.jpa.open-in-view=false

# ===== Spring Data REST =====
# Les repositories exposés automatiquement sont rangés sous /api/data (par exemple /api/data/students).
# Sans ce préfixe, Data REST publierait /students/{id}, qui entre en conflit avec /students/all du contrôleur.
spring.data.rest.base-path=/api/data

# ===== Swagger (springdoc) =====
# Interface : http://localhost:8080/swagger-ui.html  -  description OpenAPI brute : /v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
# Swagger ne documente que les contrôleurs écrits à la main : les dizaines de routes générées par Data REST
# (toujours actives sous /api/data) noieraient les endpoints du TP
springdoc.paths-to-exclude=/api/data/**
